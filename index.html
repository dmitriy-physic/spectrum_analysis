<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

СПЕКТРАНАЛИТИКА

</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

    *{
margin:0;
padding:0;
box-sizing:border-box;
}

html{

scroll-behavior:smooth;

}

body{

font-family:'Manrope',sans-serif;

background:#D9EBF8;

color:#17324A;

overflow-x:hidden;

line-height:1.6;

}

:root{

--background:#D9EBF8;

--card:#ffffff;

--accent:#2F80ED;

--text:#17324A;

--text2:#4F637A;

--shadow:0 20px 60px rgba(0,0,0,.08);

}

.container{

width:min(1320px,92%);

margin:auto;

}

section{

padding:110px 0;

}

a{

text-decoration:none;

color:inherit;

}

img{

max-width:100%;

display:block;

}

    /*==========================
NAVBAR
==========================*/

nav{

position:fixed;

top:0;

left:0;

width:100%;

height:90px;

display:flex;

align-items:center;

z-index:1000;

backdrop-filter:blur(18px);

background:rgba(255,255,255,.70);

border-bottom:1px solid rgba(0,0,0,.04);

}

.nav-inner{

display:flex;

justify-content:space-between;

align-items:center;

height:90px;

}

.logo{

font-size:34px;

font-weight:800;

letter-spacing:.5px;

}

.logo span{

color:var(--accent);

}

.nav-links{

display:flex;

gap:42px;

align-items:center;

}

.nav-links a{

font-weight:600;

transition:.25s;

}

.nav-links a:hover{

color:var(--accent);

}

.button{

padding:15px 30px;

border-radius:16px;

background:var(--accent);

color:white;

font-weight:700;

transition:.25s;

box-shadow:0 10px 35px rgba(47,128,237,.25);

}

.button:hover{

transform:translateY(-2px);

}

    /*==========================
HERO
==========================*/

.hero{

min-height:100vh;

display:flex;

align-items:center;

padding-top:100px;

position:relative;

overflow:hidden;

}

.hero::before{

content:"";

position:absolute;

left:-200px;

top:-200px;

width:700px;

height:700px;

border-radius:50%;

background:rgba(47,128,237,.08);

filter:blur(80px);

}

.hero-grid{

display:grid;

grid-template-columns:1fr 620px;

gap:90px;

align-items:center;

position:relative;

z-index:2;

}

.hero-badge{

display:inline-block;

padding:10px 18px;

border-radius:30px;

background:white;

font-size:14px;

font-weight:700;

color:var(--accent);

margin-bottom:28px;

box-shadow:var(--shadow);

}

.hero h1{

font-size:64px;

line-height:1.05;

margin-bottom:28px;

font-weight:800;

}

.hero p{

font-size:21px;

color:var(--text2);

margin-bottom:42px;

max-width:760px;

}

.hero-buttons{

display:flex;

gap:18px;

}

.secondary{

background:white;

color:var(--text);

}

.secondary:hover{

background:#edf5ff;

}

    .program{

background:white;

border-radius:26px;

box-shadow:var(--shadow);

overflow:hidden;

}

.program-header{

height:56px;

display:flex;

align-items:center;

padding:0 22px;

background:#f5f8fc;

gap:10px;

border-bottom:1px solid #e8edf3;

}

.dot{

width:12px;

height:12px;

border-radius:50%;

}

.red{

background:#ff5f56;

}

.yellow{

background:#ffbd2e;

}

.green{

background:#27c93f;

}

.program-body{

display:grid;

grid-template-columns:180px 1fr;

height:470px;

}

.sidebar{

background:#f8fbff;

padding:24px;

border-right:1px solid #e7eef7;

}

.sidebar h3{

font-size:16px;

margin-bottom:18px;

}

.menu-item{

padding:12px;

margin-bottom:10px;

border-radius:12px;

background:white;

font-size:15px;

}

.workspace{

padding:28px;

display:flex;

flex-direction:column;

justify-content:space-between;

}
